[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "tqdm>=4.70.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14", "torch>=2.2", "numpy>=1.26", "tqdm>=4.66"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "harness"]
