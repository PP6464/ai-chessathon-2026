[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
    "onnxscript>=0.7.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14", "datasets>=5.0.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "harness"]
